blueprint:
  name: Tapo Lightning – virtueller Ein/Aus-Knopf
  description: >
    Skript-Blueprint für einen Dashboard-Button: erster Klick schaltet
    den LED-Streifen mit dem gewünschten Lichteffekt ein, nächster Klick
    schaltet ihn aus. Der Effekt muss von der Licht-Integration unterstützt
    werden und exakt so in effect_list stehen.
  domain: script
  input:
    led_strip:
      name: LED-Streifen
      description: Wähle deinen Tapo L900-5 LED-Streifen aus.
      selector:
        entity:
          filter:
            - domain: light
    effect_name:
      name: Effektname
      description: Exakter Name des Effekts in Home Assistant (effect_list).
      default: Lightning
      selector:
        text:

mode: single
variables:
  led_strip: !input led_strip
  effect_name: !input effect_name
sequence:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_state(led_strip, 'on') }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input led_strip
    default:
      - action: light.turn_on
        target:
          entity_id: !input led_strip
        data:
          effect: "{{ effect_name }}"
